
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="cage-connection-icon.png">
<link rel="apple-touch-icon" href="cage-connection-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cage Connection">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cage Connection</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
    }

    #toolbar {
      padding: 12px;
      background: #111;
      border-bottom: 1px solid #333;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    #statusText {
      margin-left: 8px;
      color: #ffd54a;
      font-size: 14px;
      font-weight: 600;
    }

    button {
      padding: 9px 12px;
      cursor: pointer;
      background: #1e2a3a;
      color: white;
      border: 1px solid #444;
      border-radius: 6px;
      font-size: 14px;
    }

    button:hover {
      background: #2a3950;
    }

    #board {
      position: relative;
      width: 100vw;
      height: calc(100vh - 64px);
      overflow: auto;
      background: #0b0f14;
    }

    #surface {
      position: relative;
      width: 6000px;
      height: 4000px;
    }

    .node {
      position: absolute;
      background: #24364d;
      padding: 10px 12px 12px;
      border-radius: 9px;
      cursor: move;
      border: 2px solid #5c6f8a;
      min-width: 130px;
      max-width: 180px;
      text-align: center;
      user-select: none;
      z-index: 2;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      transition: opacity 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
      line-height: 1.25;
    }

    .node-title {
      margin-bottom: 6px;
      word-break: break-word;
    }

    .node-poster {
      width: 100%;
      height: 115px;
      object-fit: cover;
      border-radius: 7px;
      margin-bottom: 7px;
      background: #111;
      display: block;
    }

    .node-usage {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 999px;
      background: #162234;
      border: 1px solid #3b567c;
      color: #d9e7ff;
    }

    .node.connecting {
      border-color: #6aa6ff;
    }

    .node.focused {
      border-color: #ffd54a;
      box-shadow: 0 0 0 3px rgba(255, 213, 74, 0.15);
    }

    .node.dimmed {
      opacity: 0.22;
    }

    .node.full {
      border-color: #b86a6a;
    }

    svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 6000px;
      height: 4000px;
      z-index: 1;
    }

    .connection-line {
      stroke: #8fc0ff;
      stroke-width: 3;
      transition: opacity 0.2s ease, stroke 0.2s ease, stroke-width 0.2s ease;
    }

    .connection-line.active {
      stroke: #ffd54a;
      stroke-width: 4;
    }

    .connection-line.dimmed {
      opacity: 0.15;
    }

    .connection-hitbox {
      stroke: transparent;
      stroke-width: 18;
      cursor: pointer;
    }

    .connection-label-bg {
      fill: rgba(11, 15, 20, 0.92);
      stroke: #4a607f;
      stroke-width: 1;
    }

    .connection-label-bg.active {
      stroke: #ffd54a;
    }

    .connection-label-bg.dimmed {
      opacity: 0.15;
    }

    .connection-title {
      fill: #ffffff;
      font-size: 14px;
      font-weight: 700;
      text-anchor: middle;
      cursor: pointer;
    }

    .connection-actors {
      fill: #cfe2ff;
      font-size: 12px;
      font-weight: 500;
      text-anchor: middle;
      cursor: pointer;
    }

    .label-dimmed {
      opacity: 0.18;
    }

    #modalOverlay,
    #pickerOverlay,
    #pathOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #modalOverlay.hidden,
    #pickerOverlay.hidden,
    #pathOverlay.hidden {
      display: none;
    }

    #modal,
    #pickerModal {
      width: min(980px, 94vw);
      max-height: 86vh;
      overflow: auto;
      background: #111826;
      border: 1px solid #334766;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 22px;
    }

    #movieSearch {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #3a4f6f;
      background: #182234;
      color: white;
      font-size: 15px;
    }

    .picker-actions {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    #movieList {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .movie-item {
      background: #182234;
      border: 1px solid #314763;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .movie-item label {
      flex: 1;
      cursor: pointer;
    }

    .movie-item input[type="checkbox"] {
      transform: scale(1.2);
    }

    .index-section {
      margin-bottom: 22px;
    }

    .index-section h3 {
      margin: 0 0 10px 0;
      color: #ffd54a;
    }

    .index-box {
      background: #182234;
      border: 1px solid #314763;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .index-line {
      margin: 4px 0;
      color: #d9e7ff;
    }

    .actor-name {
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }


    /* Mobile / app-friendly improvements */
    .danger-button {
      background: #4a1f1f;
      border-color: #8a3a3a;
    }

    .danger-button:hover {
      background: #642828;
    }

    .node {
      touch-action: none;
    }


    .path-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .path-controls label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #ffd54a;
      margin-bottom: 6px;
    }

    .path-controls select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #3a4f6f;
      background: #182234;
      color: white;
      font-size: 15px;
    }

    #pathResult .path-step {
      background: #182234;
      border: 1px solid #314763;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    #pathResult .path-movie {
      color: #ffffff;
      font-weight: 800;
      font-size: 16px;
    }

    #pathResult .path-connection {
      color: #d9e7ff;
      margin-top: 6px;
      line-height: 1.35;
    }

    #pathResult .path-empty {
      color: #d9e7ff;
      background: #182234;
      border: 1px solid #314763;
      border-radius: 10px;
      padding: 12px;
    }

    @media (max-width: 700px) {
      #toolbar {
        position: sticky;
        top: 0;
        z-index: 10000;
        padding: 8px;
        gap: 6px;
      }

      button {
        padding: 10px 11px;
        font-size: 13px;
      }

      #statusText {
        flex-basis: 100%;
        margin-left: 0;
        font-size: 13px;
      }

      #board {
        height: calc(100vh - 108px);
      }

      .node {
        min-width: 145px;
        max-width: 190px;
        font-size: 15px;
        padding: 12px 14px;
      }

      #movieList {
        grid-template-columns: 1fr;
      }

      .path-controls {
        grid-template-columns: 1fr;
      }

      #modal,
      #pickerModal {
        width: 94vw;
        max-height: 84vh;
        padding: 14px;
      }
    }

  </style>
</head>
<body>
  <div id="toolbar">
    <span style="font-size:22px;font-weight:bold;color:#ffd54a;margin-right:12px;">
      🎬 Cage Connection
    </span>

    <input
      type="text"
      id="movieSearchBox"
      placeholder="Find movie..."
      style="padding:8px 10px;border-radius:6px;border:1px solid #555;background:#182234;color:white;width:180px;"
    >

    <button onclick="findMovie()">Find</button>
    <button onclick="openMoviePicker()">+ Add Movie</button>
    <button onclick="connectMode()">Connect Movies</button>
    <button onclick="clearSelection()">Clear Selection</button>
    <button onclick="clearFocus()">Clear Focus</button>
    <button onclick="showIndex()">Show Index</button>
    <button onclick="openPathFinder()">Find Path</button>
    <button onclick="autoArrangeAllComponents()">Auto Arrange</button>
    <button onclick="exportBoard()">Export Backup</button>
    <button onclick="document.getElementById('importFile').click()">Import Backup</button>
    <button class="danger-button" onclick="resetBoard()">Reset Board</button>

    <input id="importFile" type="file" accept="application/json,.json,.txt" style="display:none" onchange="importBoardFromFile(event)" />

    <span id="statusText">Ready.</span>
    <span id="scoreDisplay" style="margin-left:15px;font-weight:bold;color:#ffd54a;font-size:18px;">Score: 0</span>
  </div>

  <div id="board">
    <div id="surface">
      <svg id="lines"></svg>
    </div>
  </div>

  <div id="pickerOverlay" class="hidden" onclick="closeMoviePicker(event)">
    <div id="pickerModal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>Add Nicolas Cage Movies</h2>
        <button onclick="closeMoviePicker()">Close</button>
      </div>

      <input id="movieSearch" type="text" placeholder="Search titles..." oninput="renderMovieList()" />

      <div class="picker-actions">
        <button onclick="selectAllVisibleMovies()">Select All Visible</button>
        <button onclick="clearMovieChecks()">Clear Checks</button>
        <button onclick="addSelectedMovies()">Add Selected</button>
        <button onclick="addAllVisibleMovies()">Add All Visible</button>
        <button onclick="addCustomMovie()">Add Custom Title</button>
      </div>

      <div id="movieList"></div>
    </div>
  </div>


  <div id="pathOverlay" class="hidden" onclick="closePathFinder(event)">
    <div id="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>Find Shortest Path</h2>
        <button onclick="closePathFinder()">Close</button>
      </div>

      <div class="path-controls">
        <div>
          <label for="pathStart">From</label>
          <select id="pathStart"></select>
        </div>
        <div>
          <label for="pathEnd">To</label>
          <select id="pathEnd"></select>
        </div>
      </div>

      <div class="picker-actions">
        <button onclick="findAndShowPath()">Find Path</button>
        <button onclick="swapPathMovies()">Swap</button>
      </div>

      <div id="pathResult" class="index-section"></div>
    </div>
  </div>

  <div id="modalOverlay" class="hidden" onclick="closeIndex(event)">
    <div id="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2>Cage Connection Index</h2>
        <button onclick="closeIndex()">Close</button>
      </div>
      <div id="indexContent"></div>
    </div>
  </div>

  <script>
    const board = document.getElementById("board");
    const surface = document.getElementById("surface");
    const svg = document.getElementById("lines");
    const modalOverlay = document.getElementById("modalOverlay");
    const indexContent = document.getElementById("indexContent");
    const pathOverlay = document.getElementById("pathOverlay");
    const pathStart = document.getElementById("pathStart");
    const pathEnd = document.getElementById("pathEnd");
    const pathResult = document.getElementById("pathResult");
    const pickerOverlay = document.getElementById("pickerOverlay");
    const movieSearch = document.getElementById("movieSearch");
    const movieList = document.getElementById("movieList");
    const statusText = document.getElementById("statusText");

    const BUILT_IN_TITLES = [

      "The Croods",

      "The Family Man",

      "The Old Way",

      "Zandalee"
    ];

    const STORAGE_KEY = "cage-universe-v12";
    const CUSTOM_TITLES_KEY = "cage-universe-custom-titles-v4";

    let nodes = [];
    let connections = [];
    let connectModeActive = false;
    let connectFirstNode = null;
    let highestZ = 2;
    let focusedNodeId = null;
    let customTitles = loadCustomTitles();

    loadBoard();
    setStatus("Ready.");
    updateScoreDisplay();

    function setStatus(text) {
      statusText.textContent = text;
      updateScoreDisplay();
    }

    function calculateScore() {
      return connections.reduce((total, c) => {
        if (c.type === "bridge") return total + 2;
        if (c.type === "shared") return total + 1;
        return total;
      }, 0);
    }

    function updateScoreDisplay() {
      const scoreDisplay = document.getElementById("scoreDisplay");
      if (!scoreDisplay) return;
      scoreDisplay.textContent = `Score: ${calculateScore()}`;
    }

    function normalizeTitle(title) {
      return String(title).trim().toLowerCase();
    }

    function posterFileName(title) {
      return String(title)
        .trim()
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/'/g, "")
        .replace(/:/g, "")
        .replace(/\//g, "-")
        .replace(/!/g, "")
        .replace(/\./g, "")
        .replace(/\?/g, "")
        .replace(/\s+/g, "-");
    }

    function loadCustomTitles() {
      const raw = localStorage.getItem(CUSTOM_TITLES_KEY);
      if (!raw) return [];
      try {
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveCustomTitles() {
      localStorage.setItem(CUSTOM_TITLES_KEY, JSON.stringify(customTitles));
    }

    function getAllTitles() {
      const merged = [...BUILT_IN_TITLES, ...customTitles];
      const seen = new Set();
      const deduped = [];

      for (const title of merged) {
        const key = normalizeTitle(title);
        if (!key || seen.has(key)) continue;
        seen.add(key);
        deduped.push(title);
      }

      return deduped.sort((a, b) => a.localeCompare(b));
    }

    function saveBoard() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(getBoardData()));
    }

    function loadBoardFromData(data) {
      nodes.forEach(n => n.el.remove());
      nodes = [];
      connections = [];
      focusedNodeId = data.focusedNodeId || null;
      connectModeActive = false;
      connectFirstNode = null;
      svg.innerHTML = "";
      surface.querySelectorAll(".node").forEach(n => n.remove());

      if (Array.isArray(data.nodes)) {
        data.nodes.forEach(n => createNodeFromData(n));
      }

      if (Array.isArray(data.connections)) {
        data.connections.forEach(c => {
          const a = nodes.find(n => n.id === c.aId);
          const b = nodes.find(n => n.id === c.bId);
          if (a && b) {
            connections.push({
              id: c.id,
              type: c.type || "bridge",
              a,
              b,
              bridgeTitle: c.bridgeTitle || "",
              leftActor: c.leftActor || "",
              rightActor: c.rightActor || "",
              sharedActor: c.sharedActor || ""
            });
          }
        });
      }

      redrawNodes();
      draw();
      applyFocusStyles();
      updateWinStatus();
      renderMovieList();
    }

    function loadBoard() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;

      try {
        const data = JSON.parse(raw);
        loadBoardFromData(data);
      } catch (e) {
        console.error("Load failed", e);
        setStatus("Saved board could not be loaded.");
      }
    }

    function getBoardData() {
      return {
        nodes: nodes.map(n => ({
          id: n.id,
          name: n.name,
          x: n.x,
          y: n.y
        })),
        connections: connections.map(c => ({
          id: c.id,
          type: c.type,
          aId: c.a.id,
          bId: c.b.id,
          bridgeTitle: c.bridgeTitle || "",
          leftActor: c.leftActor || "",
          rightActor: c.rightActor || "",
          sharedActor: c.sharedActor || ""
        })),
        focusedNodeId
      };
    }
function findMovie() {
  const box = document.getElementById("movieSearchBox");
  if (!box) return;

  const search = box.value.trim().toLowerCase();

  if (!search) {
    alert("Type a movie title first.");
    return;
  }

  const matches = nodes.filter(n =>
    n.name.toLowerCase().includes(search)
  );

  if (!matches.length) {
    alert("No matching movie found.");
    return;
  }

  const movie = matches[0];

  focusedNodeId = movie.id;
  bringToFront(movie.el);
  centerOnNode(movie);
  applyFocusStyles();
  saveBoard();

  setStatus(`Found: ${movie.name}`);
}
    function exportBoard() {
      const exportData = {
        app: "Cage Connection",
        storageKey: STORAGE_KEY,
        exportedAt: new Date().toISOString(),
        board: getBoardData(),
        customTitles
      };

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
      a.href = url;
      a.download = `cage-connection-backup-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setStatus("Backup exported.");
    }

    function importBoardFromFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          const boardData = parsed.board || parsed;

          if (!boardData || !Array.isArray(boardData.nodes) || !Array.isArray(boardData.connections)) {
            alert("That file does not look like a Cage Connection backup.");
            return;
          }

          const ok = confirm(
            "Import this backup?\n\nThis will replace the Cage Connection board currently saved in this browser. Export the current board first if you want to keep it."
          );
          if (!ok) return;

          if (Array.isArray(parsed.customTitles)) {
            customTitles = parsed.customTitles;
            saveCustomTitles();
          }

          localStorage.setItem(STORAGE_KEY, JSON.stringify(boardData));
          loadBoardFromData(boardData);
          saveBoard();
          setStatus("Backup imported.");
        } catch (err) {
          console.error(err);
          alert("Import failed. Make sure you selected the full backup JSON file.");
        } finally {
          event.target.value = "";
        }
      };
      reader.readAsText(file);
    }

    function resetBoard() {
      const firstConfirm = confirm(
        "Are you sure you want to reset the entire Cage Connection board?\n\nThis will delete all movies, connections, actors, and layout work saved in this browser."
      );

      if (!firstConfirm) return;

      const typed = prompt(
        "This cannot be undone unless you have exported or backed up your board.\n\nType RESET to permanently delete the board."
      );

      if (typed !== "RESET") {
        alert("Reset cancelled. Your board was not changed.");
        return;
      }

      nodes.forEach(n => n.el.remove());
      nodes = [];
      connections = [];
      focusedNodeId = null;
      connectModeActive = false;
      connectFirstNode = null;
      svg.innerHTML = "";
      localStorage.removeItem(STORAGE_KEY);
      closeIndex();
      closeMoviePicker();
      closePathFinder();
      renderMovieList();
      updateScoreDisplay();
      setStatus("Board reset.");
    }

    function getNextGridPosition() {
      const cols = 6;
      const xStart = 60;
      const yStart = 70;
      const xGap = 180;
      const yGap = 90;

      const index = nodes.length;
      const col = index % cols;
      const row = Math.floor(index / cols);

      return {
        x: xStart + (col * xGap),
        y: yStart + (row * yGap)
      };
    }

    function getNextGridPositions(count) {
      const positions = [];
      for (let i = 0; i < count; i++) {
        const cols = 6;
        const xStart = 60;
        const yStart = 70;
        const xGap = 180;
        const yGap = 90;

        const index = nodes.length + i;
        const col = index % cols;
        const row = Math.floor(index / cols);

        positions.push({
          x: xStart + (col * xGap),
          y: yStart + (row * yGap)
        });
      }
      return positions;
    }

    function createNodeFromData(data) {
      const node = document.createElement("div");
      node.className = "node";
      node.style.left = (data.x || 80) + "px";
      node.style.top = (data.y || 80) + "px";
      node.style.zIndex = ++highestZ;

      surface.appendChild(node);

      const obj = {
        id: data.id,
        el: node,
        name: data.name,
        x: data.x || 80,
        y: data.y || 80
      };

      nodes.push(obj);
      makeDraggable(obj);
      attachNodeEvents(obj);
      renderNode(obj);
      return obj;
    }

function renderNode(nodeObj) {
      const degree = getDegree(nodeObj.id);
      const posterSrc = `posters/${posterFileName(nodeObj.name)}.jpeg`;

      nodeObj.el.innerHTML = "";

      const title = document.createElement("div");
      title.className = "node-title";
      title.textContent = nodeObj.name;

      const usage = document.createElement("div");
      usage.className = "node-usage";
      usage.textContent = `${degree}/2`;

      nodeObj.el.appendChild(title);
      nodeObj.el.appendChild(usage);

      const img = new Image();
      img.className = "node-poster";
      img.alt = "";
      img.onload = function () {
        nodeObj.el.insertBefore(img, title);
        draw();
      };
      img.src = posterSrc;

      nodeObj.el.classList.toggle("full", degree >= 2);
    }

    function redrawNodes() {
      nodes.forEach(renderNode);
    }

    function addMovieByName(name, position = null) {
      if (!name || !name.trim()) return null;

      const cleaned = name.trim();
      const existing = nodes.find(n => normalizeTitle(n.name) === normalizeTitle(cleaned));

      if (existing) {
        focusedNodeId = existing.id;
        bringToFront(existing.el);
        centerOnNode(existing);
        applyFocusStyles();
        saveBoard();
        return existing;
      }

      const point = position || getNextGridPosition();

      const created = createNodeFromData({
        id: crypto.randomUUID(),
        name: cleaned,
        x: point.x,
        y: point.y
      });

      focusedNodeId = null;
      saveBoard();
      draw();
      updateWinStatus();
      return created;
    }

    function centerOnNode(nodeObj) {
      board.scrollLeft = Math.max(0, nodeObj.x - board.clientWidth / 2 + 100);
      board.scrollTop = Math.max(0, nodeObj.y - board.clientHeight / 2 + 30);
    }

    function openMoviePicker() {
      pickerOverlay.classList.remove("hidden");
      movieSearch.value = "";
      renderMovieList();
      setTimeout(() => movieSearch.focus(), 50);

    function closeMoviePicker(event) {
      if (event && event.target && event.target !== pickerOverlay) return;
      pickerOverlay.classList.add("hidden");
    }

    function renderMovieList() {
      const q = movieSearch.value.trim().toLowerCase();
      const titles = getAllTitles();
      const onBoard = new Set(nodes.map(n => normalizeTitle(n.name)));

      const filtered = titles.filter(title => {
        const matchesSearch = title.toLowerCase().includes(q);
        const notAlreadyOnBoard = !onBoard.has(normalizeTitle(title));
        return matchesSearch && notAlreadyOnBoard;
      });

      movieList.innerHTML = "";

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "index-box";
        empty.textContent = "No matching titles available to add.";
        movieList.appendChild(empty);
        return;
      }

      filtered.forEach(title => {
        const item = document.createElement("div");
        item.className = "movie-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.value = title;
        checkbox.className = "movie-check";

        const label = document.createElement("label");
        label.textContent = title;

        item.appendChild(checkbox);
        item.appendChild(label);
        movieList.appendChild(item);
      });

    function selectAllVisibleMovies() {
      document.querySelectorAll(".movie-check").forEach(cb => cb.checked = true);
    }

    function clearMovieChecks() {
      document.querySelectorAll(".movie-check").forEach(cb => cb.checked = false);
    }

    function addSelectedMovies() {
      const checked = Array.from(document.querySelectorAll(".movie-check:checked")).map(cb => cb.value);

      if (!checked.length) {
        alert("Select at least one movie.");
        return;
      }

      const positions = getNextGridPositions(checked.length);

      checked.forEach((title, index) => {
        addMovieByName(title, positions[index]);
      });

      saveBoard();
      draw();
      renderMovieList();
      clearMovieChecks();
      closeMoviePicker();
      updateWinStatus();

    }

    function addAllVisibleMovies() {
      const visible = Array.from(document.querySelectorAll(".movie-check")).map(cb => cb.value);

      if (!visible.length) {
        alert("No visible movies to add.");
        return;
      }

      const positions = getNextGridPositions(visible.length);

      visible.forEach((title, index) => {
        addMovieByName(title, positions[index]);
      });

      saveBoard();
      draw();
      renderMovieList();
      closeMoviePicker();
      updateWinStatus();
      setStatus(`${visible.length} visible movie${visible.length === 1 ? "" : "s"} added.`);
    }

    function addCustomMovie() {
      const name = prompt("Custom movie or show title:");
      if (!name || !name.trim()) return;

      const cleaned = name.trim();
      const existsInList = getAllTitles().some(title => normalizeTitle(title) === normalizeTitle(cleaned));

      if (!existsInList) {
        customTitles.push(cleaned);
        saveCustomTitles();
      }

      addMovieByName(cleaned);
      renderMovieList();
      closeMoviePicker();
      updateWinStatus();
      setStatus(`Added custom title: ${cleaned}`);
    }

    function attachNodeEvents(obj) {
      const node = obj.el;

      node.addEventListener("click", function (e) {
        e.stopPropagation();
        bringToFront(node);

        if (connectModeActive) {
          handleConnectClick(obj);
          return;
        }

        focusedNodeId = obj.id;
        applyFocusStyles();
        saveBoard();
      });
    }

    function getDegree(nodeId) {
      return connections.filter(c => c.a.id === nodeId || c.b.id === nodeId).length;
    }

    function getConnectionsForNode(nodeId) {
      return connections.filter(c => c.a.id === nodeId || c.b.id === nodeId);
    }

    function getOtherNode(connection, nodeId) {
      return connection.a.id === nodeId ? connection.b : connection.a;
    }

    function connectionExists(idA, idB) {
      return connections.some(c =>
        (c.a.id === idA && c.b.id === idB) || (c.a.id === idB && c.b.id === idA)
      );
    }

    function offerBreakExistingConnection(nodeObj) {
      const existing = getConnectionsForNode(nodeObj.id);

      if (!existing.length) return false;

      const lines = existing.map((c, i) => {
        const other = getOtherNode(c, nodeObj.id);
        return `${i + 1}. ${nodeObj.name} ↔ ${other.name}`;
      }).join("\n");

      const answer = prompt(
        `${nodeObj.name} already has 2 connections:\n\n${lines}\n\nType:\nKEEP = pick another movie\n1 or 2 = break that connection`,
        "KEEP"
      );

      if (answer === null) return true;

      const trimmed = answer.trim().toUpperCase();
      if (trimmed === "KEEP" || trimmed === "") {
        return true;
      }

      const index = Number(trimmed) - 1;
      if (index >= 0 && index < existing.length) {
        deleteConnection(existing[index].id, true);
        alert(`Connection removed. You can now connect ${nodeObj.name} to another movie.`);
        return false;
      }

      alert("Not understood. Keeping existing connections.");
      return true;
    }

    function getNeighbors(nodeId) {
      return connections.flatMap(c => {
        if (c.a.id === nodeId) return [c.b];
        if (c.b.id === nodeId) return [c.a];
        return [];
      });
    }

    function getConnectedComponentNodeIds(startId) {
      const visited = new Set();
      const stack = [startId];
      visited.add(startId);

      while (stack.length) {
        const current = stack.pop();
        for (const neighbor of getNeighbors(current)) {
          if (!visited.has(neighbor.id)) {
            visited.add(neighbor.id);
            stack.push(neighbor.id);
          }
        }
      }
      return visited;
    }

    function getOrderedComponent(componentIds) {
      const componentNodes = nodes.filter(n => componentIds.has(n.id));
      const endpoints = componentNodes.filter(n => getDegree(n.id) <= 1);

      if (endpoints.length >= 1) {
        const ordered = [];
        const visited = new Set();
        let current = endpoints[0];
        let prevId = null;

        while (current) {
          ordered.push(current);
          visited.add(current.id);

          const nextOptions = getNeighbors(current.id)
            .filter(n => componentIds.has(n.id))
            .filter(n => !visited.has(n.id))
            .filter(n => n.id !== prevId);

          prevId = current.id;
          current = nextOptions[0] || null;
        }

        const leftovers = componentNodes.filter(n => !visited.has(n.id))
          .sort((a, b) => a.name.localeCompare(b.name));

        return ordered.concat(leftovers);
      }

      return componentNodes.sort((a, b) => a.x - b.x);
    }

    function arrangeConnectedComponent(startId) {
      const componentIds = getConnectedComponentNodeIds(startId);
      const ordered = getOrderedComponent(componentIds);

      if (!ordered.length) return;

      const xGap = 210;
      const anchorX = Math.max(60, Math.min(...ordered.map(n => n.x)));
      const anchorY = Math.max(70, Math.min(...ordered.map(n => n.y)));

      ordered.forEach((node, index) => {
        node.x = anchorX + (index * xGap);
        node.y = anchorY;
        node.el.style.left = node.x + "px";
        node.el.style.top = node.y + "px";
      });
    }

    function handleConnectClick(obj) {
      if (!connectFirstNode) {
        if (getDegree(obj.id) >= 2) {
          const keepExisting = offerBreakExistingConnection(obj);
          if (keepExisting) {
            setStatus("Connect mode ON. Click a movie with an open slot.");
            return;
          }
        }

        clearNodeStates();
        connectFirstNode = obj;
        obj.el.classList.add("connecting");
        setStatus(`Connecting from: ${obj.name}`);
        return;
      }

      if (connectFirstNode.id === obj.id) {
        clearNodeStates();
        connectFirstNode = null;
        setStatus("Connect mode is on. Select the first movie.");
        return;
      }

      if (connectionExists(connectFirstNode.id, obj.id)) {
        alert(`${connectFirstNode.name} is already connected to ${obj.name}.`);
        return;
      }

      if (getDegree(connectFirstNode.id) >= 2) {
        const keepExisting = offerBreakExistingConnection(connectFirstNode);
        if (keepExisting) {
          clearNodeStates();
          connectFirstNode = null;
          setStatus("Connect mode is on. Select the first movie.");
          return;
        }
        clearNodeStates();
        connectFirstNode.el.classList.add("connecting");
        setStatus(`Connecting from: ${connectFirstNode.name}`);
      }

      if (getDegree(obj.id) >= 2) {
        const keepExisting = offerBreakExistingConnection(obj);
        if (keepExisting) {
          setStatus(`Connecting from: ${connectFirstNode.name}`);
          return;
        }
      }

      if (getDegree(connectFirstNode.id) >= 2 || getDegree(obj.id) >= 2) {
        setStatus("Try the connection again after freeing a slot.");
        return;
      }

      const typeChoice = prompt(
        `Connection type:\nType BRIDGE for a third movie/show connection\nType SHARED for the same actor in both movies`,
        "BRIDGE"
      );

      if (!typeChoice) return;
      const normalized = typeChoice.trim().toUpperCase();

      if (normalized === "BRIDGE") {
        const bridgeTitle = prompt("Bridge movie/show:");
        if (!bridgeTitle || !bridgeTitle.trim()) return;

        const leftActor = prompt(`Actor from "${connectFirstNode.name}":`);
        if (!leftActor || !leftActor.trim()) return;

        const rightActor = prompt(`Actor from "${obj.name}":`);
        if (!rightActor || !rightActor.trim()) return;

        connections.push({
          id: crypto.randomUUID(),
          type: "bridge",
          a: connectFirstNode,
          b: obj,
          bridgeTitle: bridgeTitle.trim(),
          leftActor: leftActor.trim(),
          rightActor: rightActor.trim(),
          sharedActor: ""
        });
      } else if (normalized === "SHARED") {
        const sharedActor = prompt(`Actor in BOTH "${connectFirstNode.name}" and "${obj.name}":`);
        if (!sharedActor || !sharedActor.trim()) return;

        connections.push({
          id: crypto.randomUUID(),
          type: "shared",
          a: connectFirstNode,
          b: obj,
          bridgeTitle: "",
          leftActor: "",
          rightActor: "",
          sharedActor: sharedActor.trim()
        });
      } else {
        alert("Please enter BRIDGE or SHARED.");
        return;
      }

      const firstName = connectFirstNode.name;
      const startId = connectFirstNode.id;
      clearNodeStates();
      connectFirstNode = null;
      arrangeConnectedComponent(startId);
      redrawNodes();
      draw();
      saveBoard();
      updateWinStatus();
      renderMovieList();
      setStatus(`Connected ${firstName} to ${obj.name}. Connect mode still on.`);
    }

    function connectMode() {
      connectModeActive = true;
      connectFirstNode = null;
      clearNodeStates();
      setStatus("Connect mode ON. Click the first movie.");
    }

 function clearSelection() {
  clearNodeStates();
  connectModeActive = false;
  connectFirstNode = null;
  setStatus("Ready.");
  updateScoreDisplay();
}

function clearFocus() {
  focusedNodeId = null;
  applyFocusStyles();
  updateScoreDisplay();
  saveBoard();
}

    function clearNodeStates() {
      nodes.forEach(n => n.el.classList.remove("connecting"));
    }

    function bringToFront(nodeEl) {
      nodeEl.style.zIndex = ++highestZ;
    }

    function deleteNode(nodeId) {
      const idx = nodes.findIndex(n => n.id === nodeId);
      if (idx === -1) return;

      nodes[idx].el.remove();
      nodes.splice(idx, 1);
      connections = connections.filter(c => c.a.id !== nodeId && c.b.id !== nodeId);

      if (focusedNodeId === nodeId) focusedNodeId = null;
      if (connectFirstNode && connectFirstNode.id === nodeId) connectFirstNode = null;

      redrawNodes();
      draw();
      applyFocusStyles();
      saveBoard();
      renderMovieList();
      updateWinStatus();
    }

    function deleteConnection(connectionId, silent = false) {
      const doomed = connections.find(c => c.id === connectionId);
      connections = connections.filter(c => c.id !== connectionId);

      if (doomed) {
        arrangeConnectedComponent(doomed.a.id);
        arrangeConnectedComponent(doomed.b.id);
      }

      redrawNodes();
      draw();
      applyFocusStyles();
      saveBoard();
      renderMovieList();
      updateWinStatus();
      if (!silent) setStatus("Connection removed.");
    }

    function editConnection(connectionId) {
      const c = connections.find(x => x.id === connectionId);
      if (!c) return;

      const action = prompt(
        `Type EDIT to change this connection, or DELETE to remove it:`,
        "EDIT"
      );
      if (action === null) return;

      if (action.trim().toUpperCase() === "DELETE") {
        deleteConnection(connectionId);
        return;
      }

      if (action.trim().toUpperCase() !== "EDIT") return;

      const typeChoice = prompt(
        `Connection type:\nType BRIDGE or SHARED`,
        c.type === "shared" ? "SHARED" : "BRIDGE"
      );
      if (!typeChoice) return;

      const normalized = typeChoice.trim().toUpperCase();

      if (normalized === "BRIDGE") {
        const bridgeTitle = prompt("Bridge movie/show:", c.bridgeTitle || "");
        if (!bridgeTitle || !bridgeTitle.trim()) return;

        const leftActor = prompt(`Actor from "${c.a.name}":`, c.leftActor || "");
        if (!leftActor || !leftActor.trim()) return;

        const rightActor = prompt(`Actor from "${c.b.name}":`, c.rightActor || "");
        if (!rightActor || !rightActor.trim()) return;

        c.type = "bridge";
        c.bridgeTitle = bridgeTitle.trim();
        c.leftActor = leftActor.trim();
        c.rightActor = rightActor.trim();
        c.sharedActor = "";
      } else if (normalized === "SHARED") {
        const sharedActor = prompt(
          `Actor in BOTH "${c.a.name}" and "${c.b.name}":`,
          c.sharedActor || ""
        );
        if (!sharedActor || !sharedActor.trim()) return;

        c.type = "shared";
        c.sharedActor = sharedActor.trim();
        c.bridgeTitle = "";
        c.leftActor = "";
        c.rightActor = "";
      } else {
        alert("Please enter BRIDGE or SHARED.");
        return;
      }

      draw();
      applyFocusStyles();
      saveBoard();
      updateWinStatus();
      setStatus("Connection updated.");
    }

    function getConnectedNodeIds(startId) {
      if (!startId) return new Set();

      const visited = new Set();
      const stack = [startId];
      visited.add(startId);

      while (stack.length) {
        const current = stack.pop();
        for (const neighbor of getNeighbors(current)) {
          if (!visited.has(neighbor.id)) {
            visited.add(neighbor.id);
            stack.push(neighbor.id);
          }
        }
      }

      return visited;
    }

    function updateWinStatus() {
      redrawNodes();

      if (!nodes.length) {
        if (!connectModeActive) setStatus("Ready.");
        return;
      }

      const overLimit = nodes.some(n => getDegree(n.id) > 2);
      if (overLimit) {
        setStatus("Invalid board: a movie has more than 2 connections.");
        return;
      }

      const nodesWithConnections = nodes.filter(n => getDegree(n.id) > 0);
      if (!nodesWithConnections.length) {
        if (!connectModeActive) setStatus(`Ready. 0/${nodes.length} connected.`);
        return;
      }

      const visited = getConnectedNodeIds(nodesWithConnections[0].id);
      const allConnectedToSingleGroup = nodes.every(n => visited.has(n.id));
      const degrees = nodes.map(n => getDegree(n.id));
      const endpoints = degrees.filter(d => d === 1).length;
      const zeroes = degrees.filter(d => d === 0).length;
      const allDegreesValid = degrees.every(d => d <= 2);

      const chainWin = allConnectedToSingleGroup && allDegreesValid && zeroes === 0 && endpoints === 2;
      const loopWin = allConnectedToSingleGroup && allDegreesValid && zeroes === 0 && degrees.every(d => d === 2);

      if (chainWin || loopWin) {
        setStatus("🎉 You win! All movies are connected with no overlaps.");
        return;
      }

      if (!connectModeActive) {
        const connectedCount = nodes.filter(n => getDegree(n.id) > 0).length;
        setStatus(`${connectedCount}/${nodes.length} movies connected. Degree limit: 2.`);
      }
    }

    function applyFocusStyles() {
      const activeNodeIds = getConnectedNodeIds(focusedNodeId);

      nodes.forEach(n => {
        n.el.classList.remove("focused", "dimmed");
        if (!focusedNodeId) return;
        if (activeNodeIds.has(n.id)) n.el.classList.add("focused");
        else n.el.classList.add("dimmed");
      });

      const lineEls = svg.querySelectorAll(".connection-line");
      const bgEls = svg.querySelectorAll(".connection-label-bg");
      const titleEls = svg.querySelectorAll(".connection-title");
      const actorEls = svg.querySelectorAll(".connection-actors");

      connections.forEach((c, index) => {
        const active = !focusedNodeId || (activeNodeIds.has(c.a.id) && activeNodeIds.has(c.b.id));

        const line = lineEls[index];
        const bg = bgEls[index];
        const title = titleEls[index];
        const actors = actorEls[index];

        if (!line || !bg || !title || !actors) return;

        line.classList.remove("active", "dimmed");
        bg.classList.remove("active", "dimmed");
        title.classList.remove("label-dimmed");
        actors.classList.remove("label-dimmed");

        if (!focusedNodeId) return;

        if (active) {
          line.classList.add("active");
          bg.classList.add("active");
        } else {
          line.classList.add("dimmed");
          bg.classList.add("dimmed");
          title.classList.add("label-dimmed");
          actors.classList.add("label-dimmed");
        }
      });
    }

    function draw() {
      svg.innerHTML = "";

      for (const c of connections) {
        const x1 = c.a.x + (c.a.el.offsetWidth / 2);
        const y1 = c.a.y + (c.a.el.offsetHeight / 2);
        const x2 = c.b.x + (c.b.el.offsetWidth / 2);
        const y2 = c.b.y + (c.b.el.offsetHeight / 2);

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", x1);
        line.setAttribute("y1", y1);
        line.setAttribute("x2", x2);
        line.setAttribute("y2", y2);
        line.setAttribute("class", "connection-line");
        svg.appendChild(line);

        const hitbox = document.createElementNS("http://www.w3.org/2000/svg", "line");
        hitbox.setAttribute("x1", x1);
        hitbox.setAttribute("y1", y1);
        hitbox.setAttribute("x2", x2);
        hitbox.setAttribute("y2", y2);
        hitbox.setAttribute("class", "connection-hitbox");
        hitbox.addEventListener("click", (e) => {
          e.stopPropagation();
          editConnection(c.id);
        });
        svg.appendChild(hitbox);

        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;

        const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        bg.setAttribute("x", midX - 110);
        bg.setAttribute("y", midY - 36);
        bg.setAttribute("width", 220);
        bg.setAttribute("height", 48);
        bg.setAttribute("rx", 8);
        bg.setAttribute("ry", 8);
        bg.setAttribute("class", "connection-label-bg");
        bg.addEventListener("click", (e) => {
          e.stopPropagation();
          editConnection(c.id);
        });
        svg.appendChild(bg);

        const title = document.createElementNS("http://www.w3.org/2000/svg", "text");
        title.setAttribute("x", midX);
        title.setAttribute("y", midY - 16);
        title.setAttribute("class", "connection-title");
        title.textContent = c.type === "shared" ? c.sharedActor : c.bridgeTitle;
        title.addEventListener("click", (e) => {
          e.stopPropagation();
          editConnection(c.id);
        });
        svg.appendChild(title);

        const actors = document.createElementNS("http://www.w3.org/2000/svg", "text");
        actors.setAttribute("x", midX);
        actors.setAttribute("y", midY + 4);
        actors.setAttribute("class", "connection-actors");
        actors.textContent = c.type === "shared"
          ? "same actor in both"
          : `${c.leftActor} ↔ ${c.rightActor}`;
        actors.addEventListener("click", (e) => {
          e.stopPropagation();
          editConnection(c.id);
        });
        svg.appendChild(actors);
      }

      applyFocusStyles();
      updateScoreDisplay();
    }

    function snapToGrid(value, gridSize) {
  return Math.round(value / gridSize) * gridSize;
}

function isSpotOccupied(x, y, currentId) {
  return nodes.some(n =>
    n.id !== currentId &&
    Math.abs(n.x - x) < 20 &&
    Math.abs(n.y - y) < 20
  );
}

function findOpenGridSpot(x, y, currentId) {
  const gridX = 430;
  const gridY = 220;

  let snappedX = Math.max(20, snapToGrid(x, gridX));
  let snappedY = Math.max(20, snapToGrid(y, gridY));

  let attempts = 0;

  while (isSpotOccupied(snappedX, snappedY, currentId) && attempts < 100) {
    snappedX += gridX;

    if (snappedX > 5600) {
      snappedX = 20;
      snappedY += gridY;
    }

    attempts++;
  }

  return { x: snappedX, y: snappedY };
}

function makeDraggable(obj) {
  const el = obj.el;
  let offsetX = 0;
  let offsetY = 0;
  let dragging = false;
  let moved = false;

  el.addEventListener("pointerdown", function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    dragging = true;
    moved = false;
    bringToFront(el);

    const elRect = el.getBoundingClientRect();
    offsetX = e.clientX - elRect.left;
    offsetY = e.clientY - elRect.top;

    try { el.setPointerCapture(e.pointerId); } catch {}
    e.preventDefault();
  });

  el.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    moved = true;

    const rect = surface.getBoundingClientRect();
    obj.x = Math.max(20, e.clientX - rect.left - offsetX);
    obj.y = Math.max(20, e.clientY - rect.top - offsetY);

    el.style.left = obj.x + "px";
    el.style.top = obj.y + "px";
    draw();
    e.preventDefault();
  });

  function finishDrag(e) {
    if (!dragging) return;
    dragging = false;
    try { el.releasePointerCapture(e.pointerId); } catch {}

    if (moved) {
      const openSpot = findOpenGridSpot(obj.x, obj.y, obj.id);
      obj.x = openSpot.x;
      obj.y = openSpot.y;

      el.style.left = obj.x + "px";
      el.style.top = obj.y + "px";

      draw();
      saveBoard();
    }
  }

  el.addEventListener("pointerup", finishDrag);
  el.addEventListener("pointercancel", finishDrag);
}

    function openPathFinder() {
      if (nodes.length < 2) {
        alert("Add at least two movies before using Path Finder.");
        return;
      }

      populatePathSelects();
      pathResult.innerHTML = "<div class='path-empty'>Choose two movies, then click Find Path. This searches only the connections already on your board.</div>";
      pathOverlay.classList.remove("hidden");
    }

    function closePathFinder(event) {
      if (event && event.target && event.target !== pathOverlay) return;
      if (pathOverlay) pathOverlay.classList.add("hidden");
    }

    function populatePathSelects() {
      const sorted = [...nodes].sort((a, b) => a.name.localeCompare(b.name));

      const options = sorted.map(n => `<option value="${escapeHtml(n.id)}">${escapeHtml(n.name)}</option>`).join("");
      pathStart.innerHTML = options;
      pathEnd.innerHTML = options;

      if (focusedNodeId && nodes.some(n => n.id === focusedNodeId)) {
        pathStart.value = focusedNodeId;
      }

      if (sorted.length > 1 && pathEnd.value === pathStart.value) {
        const alternate = sorted.find(n => n.id !== pathStart.value);
        if (alternate) pathEnd.value = alternate.id;
      }
    }

    function swapPathMovies() {
      const start = pathStart.value;
      pathStart.value = pathEnd.value;
      pathEnd.value = start;
      findAndShowPath();
    }

    function getConnectionBetween(idA, idB) {
      return connections.find(c =>
        (c.a.id === idA && c.b.id === idB) ||
        (c.a.id === idB && c.b.id === idA)
      );
    }

    function findShortestPath(startId, endId) {
      if (!startId || !endId || startId === endId) return startId === endId ? [startId] : null;

      const queue = [startId];
      const visited = new Set([startId]);
      const previous = new Map();

      while (queue.length) {
        const current = queue.shift();
        if (current === endId) break;

        for (const neighbor of getNeighbors(current)) {
          if (visited.has(neighbor.id)) continue;
          visited.add(neighbor.id);
          previous.set(neighbor.id, current);
          queue.push(neighbor.id);
        }
      }

      if (!visited.has(endId)) return null;

      const path = [];
      let cursor = endId;
      while (cursor) {
        path.unshift(cursor);
        if (cursor === startId) break;
        cursor = previous.get(cursor);
      }
      return path;
    }

    function describeConnection(c) {
      if (!c) return "";
      if (c.type === "shared") {
        return `Shared actor: <strong>${escapeHtml(c.sharedActor)}</strong>`;
      }
      return `Bridge: <strong>${escapeHtml(c.bridgeTitle)}</strong><br>${escapeHtml(c.leftActor)} ↔ ${escapeHtml(c.rightActor)}`;
    }

    function findAndShowPath() {
      const startId = pathStart.value;
      const endId = pathEnd.value;
      const startNode = nodes.find(n => n.id === startId);
      const endNode = nodes.find(n => n.id === endId);

      if (!startNode || !endNode) {
        pathResult.innerHTML = "<div class='path-empty'>Please choose two valid movies.</div>";
        return;
      }

      if (startId === endId) {
        pathResult.innerHTML = `<div class='path-empty'>Choose two different movies.</div>`;
        return;
      }

      const path = findShortestPath(startId, endId);

      if (!path) {
        pathResult.innerHTML = `<div class='path-empty'>No path found between <strong>${escapeHtml(startNode.name)}</strong> and <strong>${escapeHtml(endNode.name)}</strong> using the connections currently on your board.</div>`;
        return;
      }

      let html = `<h3>Shortest Path: ${path.length - 1} connection${path.length - 1 === 1 ? "" : "s"}</h3>`;

      path.forEach((nodeId, index) => {
        const node = nodes.find(n => n.id === nodeId);
        if (!node) return;

        html += `<div class="path-step"><div class="path-movie">${index + 1}. ${escapeHtml(node.name)}</div>`;

        if (index < path.length - 1) {
          const nextId = path[index + 1];
          const c = getConnectionBetween(nodeId, nextId);
          html += `<div class="path-connection">↓ ${describeConnection(c)}</div>`;
        }

        html += `</div>`;
      });

      pathResult.innerHTML = html;
      focusedNodeId = startId;
      applyFocusStyles();
      setStatus(`Path found: ${startNode.name} → ${endNode.name}`);
    }

    function showIndex() {
      const movies = [...nodes].map(n => n.name).sort((a, b) => a.localeCompare(b));
      const actorMap = new Map();

      connections.forEach(c => {
        if (c.type === "shared") {
          const key = c.sharedActor;
          if (!actorMap.has(key)) actorMap.set(key, []);
          actorMap.get(key).push(`${c.a.name} — ${c.b.name} (shared cast)`);
        } else {
          const leftKey = c.leftActor;
          const rightKey = c.rightActor;

          if (!actorMap.has(leftKey)) actorMap.set(leftKey, []);
          actorMap.get(leftKey).push(`${c.a.name} — ${c.bridgeTitle}`);

          if (!actorMap.has(rightKey)) actorMap.set(rightKey, []);
          actorMap.get(rightKey).push(`${c.bridgeTitle} — ${c.b.name}`);
        }
      });

      const actorNames = [...actorMap.keys()].sort((a, b) => a.localeCompare(b));

      let html = `
        <div class="index-section">
          <h3>Movies on the Board</h3>
          <div class="index-box">
            ${movies.length ? movies.map(m => `<div class="index-line">${escapeHtml(m)}</div>`).join("") : "<div class='index-line'>No movies yet.</div>"}
          </div>
        </div>

        <div class="index-section">
          <h3>Actors Used So Far</h3>
          ${actorNames.length ? actorNames.map(actor => `
            <div class="index-box">
              <div class="actor-name">${escapeHtml(actor)}</div>
              ${actorMap.get(actor).map(line => `<div class="index-line">${escapeHtml(line)}</div>`).join("")}
            </div>
          `).join("") : "<div class='index-box'><div class='index-line'>No actors used yet.</div></div>"}
        </div>
      `;

      indexContent.innerHTML = html;
      modalOverlay.classList.remove("hidden");
    }

    function closeIndex(event) {
      if (event && event.target && event.target !== modalOverlay) return;
      modalOverlay.classList.add("hidden");
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(m) {
        return ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[m];
      });
    }

    board.addEventListener("click", function (e) {
      if (e.target === board || e.target === surface || e.target === svg) {
        clearSelection();
      }
    });

    window.addEventListener("resize", draw);
    board.addEventListener("scroll", draw);


    function autoArrangeAllComponents() {
      const visited = new Set();
      const components = [];

      nodes.forEach(node => {
        if (visited.has(node.id)) return;

        const componentIds = getConnectedComponentNodeIds(node.id);
        componentIds.forEach(id => visited.add(id));

        const ordered = getOrderedComponent(componentIds);
        components.push(ordered);
      });

      // Bigger connected chains go on top, then pairs, then singles.
      components.sort((a, b) => b.length - a.length);

      const startX = 60;
      const startY = 60;
      const xGap = 240;
      const yGap = 145;

      components.forEach((component, rowIndex) => {
        component.forEach((node, index) => {
          node.x = startX + (index * xGap);
          node.y = startY + (rowIndex * yGap);

          node.el.style.left = node.x + "px";
          node.el.style.top = node.y + "px";
        });
      });

      redrawNodes();
      draw();
      saveBoard();
      updateWinStatus();
      setStatus("Board auto-arranged.");
    }
  </script>
